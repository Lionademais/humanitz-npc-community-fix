name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build hzcommfix.so
        run: |
          gcc --version
          gcc -O2 -shared -fPIC -o shim/hzcommfix.so shim/hzcommfix.c
          strip --strip-unneeded shim/hzcommfix.so
          sha256sum shim/hzcommfix.so
          nm -D shim/hzcommfix.so
      - name: Check that every Python tool compiles
        run: python3 -m py_compile tools/*.py release/servidor/extras/humanitz_npc_patcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: hzcommfix-linux-x86_64
          path: shim/hzcommfix.so
